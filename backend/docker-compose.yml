services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartpack
      POSTGRES_PASSWORD: smartpack
      POSTGRES_DB: smartpack
    ports:
      - "5432:5432"
    volumes:
      - smartpack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpack -d smartpack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://smartpack:smartpack@db:5432/smartpack
      CORS_ORIGINS: "*"
    ports:
      - "4000:4000"

volumes:
  smartpack_pgdata:
